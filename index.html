<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Official Notice</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at top, #1f2937, #0b0f19);
    color:#fff;
}

.container{
    text-align:center;
    padding:40px;
    max-width:600px;
    width:90%;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:20px;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
    animation:fadeIn 1s ease-in-out;
}

.badge{
    display:inline-block;
    padding:6px 14px;
    background:#ef4444;
    border-radius:50px;
    font-size:12px;
    font-weight:600;
    letter-spacing:1px;
    margin-bottom:20px;
}

h1{
    font-size:clamp(2rem, 5vw, 2.5rem);
    margin-bottom:15px;
    color:#f9fafb;
}

p{
    font-size:1.2rem;
    color:#cbd5e1;
    margin:10px 0;
    line-height:1.6;
}

.highlight{
    color:#fbbf24;
    font-weight:600;
}

.signature{
    margin-top:25px;
    font-size:0.9rem;
    color:#94a3b8;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<main class="container">
    <div class="badge">📢 OFFICIAL NOTICE</div>

    <h1>Important Message</h1>

    <p>My name is <span class="highlight">Misbah</span>.</p>

    <p>
        I respectfully request not to be referred to as
        <span class="highlight">“Babe”</span>.
    </p>

    <p>
        Please use my name instead. Thank you for understanding.
    </p>

    <div class="signature">
        — Misbah
    </div>
</main>

</body>
</html>
