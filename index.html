<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Response to Official Notice</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    padding:20px;
}

.container{
    width:100%;
    max-width:650px;
    text-align:center;
    padding:40px;
    border-radius:24px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.1);
}

.badge{
    display:inline-block;
    background:#22c55e;
    padding:8px 16px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
    letter-spacing:1px;
    margin-bottom:20px;
}

h1{
    margin-bottom:20px;
}

p{
    color:#cbd5e1;
    line-height:1.8;
    margin:10px 0;
}

.highlight{
    color:#fbbf24;
    font-weight:700;
}

.buttons{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

button{
    border:none;
    padding:12px 24px;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.approve{
    background:#ef4444;
    color:white;
}

.deny{
    background:#22c55e;
    color:white;
}

button:hover{
    transform:translateY(-2px);
}

.result{
    margin-top:25px;
    font-size:1.1rem;
    min-height:40px;
}
</style>
</head>
<body>

<div class="container">

    <div class="badge">OFFICIAL RESPONSE</div>

    <h1>Regarding Your Notice 📝</h1>

    <p>
        Dear <span class="highlight">Misbah</span>,
    </p>

    <p>
        Your request to discontinue the usage of the term
        <span class="highlight">"Babe"</span>
        has been carefully reviewed.
    </p>

    <p>
        After extensive consideration, multiple meetings,
        and absolutely zero unbiased opinions...
    </p>

    <div class="buttons">
        <button class="approve" onclick="approveRequest()">Approve Request</button>
        <button class="deny" onclick="denyRequest()">Deny Request</button>
    </div>

    <div class="result" id="result"></div>

</div>

<script>
function approveRequest(){
    document.getElementById("result").innerHTML =
    "❌ Error 404: Approval not found.<br><br>Official verdict: You are still my <b>Babe ❤️</b>";
}

function denyRequest(){
    document.getElementById("result").innerHTML =
    "✅ Request Denied Successfully.<br><br>Final ruling: You remain my <b>Babe ❤️</b> and that's non-negotiable 😌";
}
</script>

</body>
</html>
